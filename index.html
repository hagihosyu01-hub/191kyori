<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="R191距離標">
    <link rel="apple-touch-icon" href="icon-192.png">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>R191萩保守距離標表示</title>

<style>
/* 画面全体のスクロールと文字自動拡大をロック */
      html, body {
        width: 100%;
        overflow-x: hidden;
        margin: 0;
        padding: 0;
        background-color: #f4f7f6;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      /* ★iPhoneのフォント崩れを防ぐため、日本語の標準ゴシック体を明示 */
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
        text-align: center;
        padding-top: 5.6vw;    /* 45px 相当 */
        padding-bottom: 5.6vw;
      }

      /* 計算結果を囲む青い箱 */
      #result {
        margin: 2.5vw auto; 
        padding: 3.75vw;       /* 30px 相当 */
        background-color: #ffffff;
        border: 0.375vw solid #007bff; /* 3px 相当 */
        border-radius: 1.875vw;        /* 15px 相当 */
        box-shadow: 0 0.5vw 1.25vw rgba(0,0,0,0.1);
        width: 87.5vw;         /* 700px 相当（画面の87.5%の幅） */
        box-sizing: border-box;
      }

      /* 上部のタイトル等の文字 */
      .status-text {
        font-size: 6.25vw;     /* 50px 相当 */
        color: #333;
        display: block;
        font-weight: bold;
      }

      /* ★最重要：キロポストの巨大な数字 */
      .kilo-post {
        display: block;
        font-size: 18vw;       /* 170px から、スマホ画面幅に100%連動するサイズに修正 */
        font-weight: 900;
        color: #d9534f;
        margin: 2.5vw 0;
        white-space: nowrap;
        line-height: 1.1;
        transform-origin: left center;
      }

      /* マスタから〇〇m の部分 */
      .distance-display {
        font-size: 4.375vw;    /* 35px 相当 */
        color: #333;
        margin-bottom: 2.5vw;
        font-weight: bold;
      }

      /* 図面の外枠 */
      .drawing-container {
        margin: 3.75vw 0;
        padding: 2.5vw;
        border: 0.25vw dashed #007bff;
        border-radius: 1.25vw;
        background-color: #f0f7ff;
      }

      /* 図面PDFを開くボタン */
      .btn-drawing {
        display: inline-block;
        padding: 1.875vw 3.75vw;
        background-color: #007bff;
        color: white;
        text-decoration: none;
        font-size: 5vw;        /* 40px 相当 */
        font-weight: bold;
        border-radius: 1vw;
        box-shadow: 0 0.5vw 0.75vw rgba(0,0,0,0.1);
      }

      .drawing-label {
        font-weight: bold;
        color: #0056b3;
        margin-bottom: 1.875vw;
        display: block;
        font-size: 3vw;
      }

      /* 距離標を共有ボタン（オレンジ） */
      .btn-share {
        display: block;
        margin-top: 2.5vw;
        padding: 2.5vw;
        background-color: #ff9800;
        color: white;
        text-decoration: none;
        font-size: 5.625vw;    /* 45px 相当 */
        font-weight: bold;
        border-radius: 1.25vw;
        box-shadow: 0 0.5vw 0.75vw rgba(0,0,0,0.2);
        border: none;
        width: 100%;
        cursor: pointer;
      }

      /* X.comへのボタン（緑） */
      .btn-back {
        display: block;
        margin-top: 3.75vw;
        padding: 2.5vw;
        background-color: #28a745;
        color: white;
        text-decoration: none;
        font-size: 5.625vw;    /* 45px 相当 */
        font-weight: bold;
        border-radius: 1.25vw;
        box-shadow: 0 0.5vw 0.75vw rgba(0,0,0,0.2);
      }

      /* 下部の注意書きボックス */
      .info-box {
        margin-top: 3.75vw;
        padding: 1.875vw;
        text-align: left;
        background: #e9ecef;
        border-radius: 1vw;
        font-size: 2.8vw;      /* 20px 相当 */
        color: #666;
        line-height: 1.5;
      }

      .info-title {
        color: #333;
        font-size: 3vw;
        font-weight: bold;
        display: block;
        margin-bottom: 0.625vw;
      }

      /* ★レスポンシブ自動縮小トリガー（画面幅800px以下の端末） */
      @media screen and (max-width: 800px) {
        body {
          transform: scale(calc(100vw / 800));
          width: 100vw;
          height: calc(100% / (100vw / 800));
        }
      }

      /* カメラ撮影ボタン（紫） */
      .btn-camera {
        display: block;
        margin-top: 2.5vw;
        padding: 2.5vw;
        background-color: #6f42c1;
        color: white;
        font-size: 5.625vw;
        font-weight: bold;
        border-radius: 1.25vw;
        box-shadow: 0 0.5vw 0.75vw rgba(0,0,0,0.2);
        border: none;
        width: 100%;
        cursor: pointer;
      }

      /* 落下物撮影ボタン（オレンジ） */
      .btn-camera-fall {
        display: block;
        margin-top: 2.5vw;
        padding: 2.5vw;
        background-color: #e8590c;
        color: white;
        font-size: 5.625vw;
        font-weight: bold;
        border-radius: 1.25vw;
        box-shadow: 0 0.5vw 0.75vw rgba(0,0,0,0.2);
        border: none;
        width: 100%;
        cursor: pointer;
      }

      /* カメラモーダル */
      #camera-modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #000;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      #camera-video {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #camera-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        display: none;
      }
      /* 撮影範囲を示す横長の枠 */
      #crop-guide {
        position: absolute;
        left: 0; right: 0;
        top: 50%;
        transform: translateY(-50%);
        /* 縦画面幅100%に対して4:3の高さ = 100vw * (960/1280) = 75vw */
        height: 75vw;
        border-top: 2px solid rgba(255,255,255,0.8);
        border-bottom: 2px solid rgba(255,255,255,0.8);
        box-shadow:
          0 -9999px 0 9999px rgba(0,0,0,0.45),
          0  9999px 0 9999px rgba(0,0,0,0.45);
        z-index: 10;
        pointer-events: none;
      }
      /* 枠の四隅 */
      #crop-guide::before,
      #crop-guide::after {
        content: '';
        position: absolute;
        width: 24px; height: 24px;
        border-color: #fff;
        border-style: solid;
      }
      #crop-guide::before {
        top: -2px; left: 0;
        border-width: 2px 0 0 2px;
      }
      #crop-guide::after {
        top: -2px; right: 0;
        border-width: 2px 2px 0 0;
      }
      /* 枠内下端のテキスト（ファインダー用） */
      #camera-kp-overlay {
        position: absolute;
        left: 0; right: 0;
        top: 50%;
        /* 枠の下端 = top50% + 75vw/2 - テキスト高さ */
        transform: translateY(calc(37.5vw - 32px));
        background: rgba(0,0,0,0.72);
        padding: 4px 10px;
        z-index: 11;
        pointer-events: none;
      }
      #camera-kp-overlay span {
        color: #fff;
        font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
        font-size: 18px;   /* 1.5倍に拡大（12px→18px） */
        font-weight: bold;
        white-space: nowrap;
        letter-spacing: 0.5px;
      }
      #camera-controls {
        position: absolute;
        bottom: 105px;   /* シャッターをボタン約2/3分(≈45px)上へ */
        left: 0; right: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 24px;
        z-index: 12;
      }
      .btn-cam-capture {
        width: 68px; height: 68px;
        border-radius: 50%;
        background: #fff;
        border: 5px solid #aaa;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        flex-shrink: 0;
      }
      .btn-cam-action {
        padding: 12px 20px;
        border-radius: 10px;
        border: none;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      }
      .btn-cam-retake { background: #555; color: #fff; }
      .btn-cam-save   { background: #007bff; color: #fff; }
      .btn-cam-lock   { background: rgba(255,255,255,0.92); color: #222; }
      .btn-cam-lock.locked { background: #e53935; color: #fff; }
      /* 横向き撮影時はシャッター等を右側中央に縦並びで配置（縦向きは下部中央のまま） */
      @media (orientation: landscape) {
        #camera-controls {
          top: 50%;
          bottom: auto;
          left: auto;
          right: 30px;
          transform: translateY(-50%);
          flex-direction: column;
        }
        /* 縦向き用の枠下端基準(37.5vw)だと横向きでは画面外に出るため、
           横向きでは画面下部中央に固定して常に見えるようにする */
        #camera-kp-overlay {
          top: auto;
          bottom: 16px;
          transform: none;
          left: 0; right: 120px;   /* 右側のシャッター領域を避ける */
          text-align: center;
        }
      }
      .btn-cam-next   { background: #e8590c; color: #fff; }

      /* ===== 落下物3枚撮影 ===== */
      /* 上部の手順バッジ（処理前 → 近景 → 処理後） */
      #fall-step-badge {
        position: absolute;
        top: 16px; left: 16px;
        display: none;
        background: rgba(232,89,12,0.92);
        color: #fff;
        font-size: 15px;
        font-weight: bold;
        padding: 8px 14px;
        border-radius: 20px;
        z-index: 13;
        box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        line-height: 1.2;
      }
      #fall-step-badge small {
        display: block;
        font-size: 11px;
        font-weight: normal;
        opacity: 0.9;
      }
      /* 撮影済みサムネの列（ライブ中に見える） */
      #fall-thumbs {
        position: absolute;
        top: 70px; left: 16px;
        display: none;
        flex-direction: column;
        gap: 6px;
        z-index: 13;
      }
      #fall-thumbs img {
        width: 64px;
        border: 2px solid #fff;
        border-radius: 4px;
        display: block;
      }
      /* 確認画面 */
      #fall-review {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: none;
        flex-direction: column;
        background: #111;
        z-index: 14;
        overflow-y: auto;
        padding: 14px;
        box-sizing: border-box;
      }
      #fall-review h3 {
        color: #fff;
        font-size: 17px;
        margin: 8px 56px 10px 0;
        text-align: center;
      }
      #fall-review .fall-kp {
        color: #ffd11a;
        font-size: 14px;
        text-align: center;
        margin-bottom: 10px;
        word-break: break-all;
      }
      .fall-review-item {
        margin-bottom: 10px;
      }
      .fall-review-item .cap {
        color: #fff;
        font-size: 13px;
        font-weight: bold;
        margin-bottom: 3px;
      }
      .fall-review-item img {
        width: 100%;
        border-radius: 6px;
        display: block;
      }
      .fall-review-item button {
        margin-top: 4px;
        padding: 6px 12px;
        font-size: 13px;
        border: none;
        border-radius: 6px;
        background: #555;
        color: #fff;
        cursor: pointer;
      }
      #fall-review-actions {
        display: flex;
        gap: 10px;
        margin: 8px 0 24px;
      }
      #fall-review-actions button {
        flex: 1;
        padding: 14px 8px;
        font-size: 16px;
        font-weight: bold;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }
      #btn-fall-upload { background: #0d8f3f; color: #fff; }
      #btn-fall-upload:disabled { background: #666; color: #ccc; }
      #btn-fall-cancel { background: #555; color: #fff; }
      /* カメラ内トースト */
      #fall-toast {
        position: absolute;
        left: 50%; bottom: 40px;
        transform: translateX(-50%);
        display: none;
        background: rgba(0,0,0,0.85);
        color: #fff;
        font-size: 15px;
        font-weight: bold;
        padding: 12px 20px;
        border-radius: 24px;
        z-index: 20;
        white-space: nowrap;
      }
      #fall-toast.ok  { background: rgba(13,143,63,0.95); }
      #fall-toast.err { background: rgba(211,47,47,0.95); }

      #camera-close {
        position: absolute;
        top: 16px; right: 16px;
        width: 44px; height: 44px;
        border-radius: 50%;
        background: rgba(0,0,0,0.55);
        border: 2px solid #fff;
        color: #fff;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 15;
        line-height: 1;
      }

      /* ===== 図面表示モーダル ===== */
      #map-modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #111;
        z-index: 8000;
        flex-direction: column;
      }
      #map-modal-header {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 48px;
        background: rgba(0,0,0,0.75);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        z-index: 10;
      }
      #map-modal-title {
        color: #fff;
        font-size: 13px;
        font-weight: bold;
      }
      #map-modal-close {
        width: 40px; height: 40px;
        border-radius: 50%;
        background: rgba(255,255,255,0.2);
        border: 2px solid #fff;
        color: #fff;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
      }
      #map-canvas-wrap {
        position: absolute;
        top: 48px; left: 0; right: 0; bottom: 0;
        overflow: hidden;
        background: #222;
        touch-action: none;
      }
      #map-canvas {
        position: absolute;
        top: 0; left: 0;
        transform-origin: 0 0;
        cursor: grab;
      }
      #map-canvas:active { cursor: grabbing; }
      #map-status {
        position: absolute;
        bottom: 16px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.7);
        color: #fff;
        font-size: 12px;
        padding: 4px 12px;
        border-radius: 12px;
        pointer-events: none;
        white-space: nowrap;
        z-index: 10;
      }
      /* 図面表示ボタン（青紫） */
      .btn-map {
        display: block;
        margin-top: 2.5vw;
        padding: 2.5vw;
        background-color: #5c6bc0;
        color: white;
        font-size: 5.625vw;
        font-weight: bold;
        border-radius: 1.25vw;
        box-shadow: 0 0.5vw 0.75vw rgba(0,0,0,0.2);
        border: none;
        width: 100%;
        cursor: pointer;
      }

      /* ===== 巡回点検モーダル ===== */
      #patrol-modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: #1a1a2e;
        z-index: 7000;
        flex-direction: column;
        align-items: stretch;
      }
      #patrol-header {
        background: #16213e;
        padding: 3vw 4vw 2vw;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #0f3460;
        flex-shrink: 0;
      }
      #patrol-kp {
        font-size: 10.5vw;
        font-weight: 900;
        color: #ffeb3b;
        letter-spacing: 0.05em;
      }
      #patrol-right {
        text-align: right;
      }
      #patrol-user-display {
        font-size: 4.5vw;
        font-weight: bold;
        color: #fff;
      }
      #patrol-time {
        font-size: 3.5vw;
        color: #aaa;
      }
      #patrol-close {
        position: absolute;
        top: 2vw; right: 3vw;
        width: 9vw; height: 9vw;
        border-radius: 50%;
        background: rgba(255,255,255,0.15);
        border: 2px solid #fff;
        color: #fff;
        font-size: 5vw;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* 名前選択レイヤー */
      #patrol-name-layer {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1;
        padding: 6vw;
        gap: 3vw;
      }
      #patrol-name-layer h2 {
        color: #fff;
        font-size: 5.5vw;
        margin-bottom: 2vw;
      }
      .patrol-name-btn {
        width: 100%;
        padding: 4.5vw;
        font-size: 5.5vw;
        font-weight: bold;
        border-radius: 3vw;
        border: 2px solid #0f3460;
        background: #16213e;
        color: #fff;
        cursor: pointer;
      }
      .patrol-name-btn:active { background: #0f3460; }

      /* 事象ボタンレイヤー */
      #patrol-event-layer {
        display: none;
        flex-direction: column;
        flex: 1;
        padding: 2vw;
        gap: 2vw;
        background: #fff;
      }
      #patrol-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2vw;
        flex: 1;
      }
      .patrol-evt-btn {
        border: none;
        border-radius: 3vw;
        cursor: pointer;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5vw;
        padding: 3vw 2vw;
        transition: transform 0.1s, opacity 0.1s;
      }
      .patrol-evt-btn:active {
        transform: scale(0.95);
        opacity: 0.8;
      }
      .patrol-evt-btn img {
        width: 72%;
        aspect-ratio: 1 / 1;
        object-fit: contain;
      }
      .patrol-evt-label {
        color: #222;
        font-size: 4.2vw;
        font-weight: bold;
        text-align: center;
        line-height: 1.3;
      }
      #patrol-change-user {
        background: none;
        border: 1px solid #444;
        color: #aaa;
        font-size: 3.5vw;
        padding: 1.5vw 3vw;
        border-radius: 2vw;
        cursor: pointer;
        align-self: center;
        flex-shrink: 0;
      }
      /* その他異常（写真撮影→送信）ボタン */
      #patrol-other-btn {
        background: #e67e22;
        border: none;
        color: #fff;
        font-size: 4.6vw;
        font-weight: bold;
        padding: 3.2vw 3vw;
        border-radius: 3vw;
        cursor: pointer;
        flex-shrink: 0;
        box-shadow: 0 0.5vw 1.5vw rgba(0,0,0,0.25);
      }
      #patrol-other-btn:active { background: #cf6f1c; transform: scale(0.98); }
      /* 黄色い車アイコン（絵文字🚗の代わり） */
      .car-ico { width: 1.15em; height: 1.15em; vertical-align: -0.22em; }
      /* 赤いピンマークアイコン */
      .pin-ico { width: 1.1em; height: 1.15em; vertical-align: -0.22em; }

      /* トースト */
      #patrol-toast {
        display: none;
        position: fixed;
        bottom: 12vw;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.85);
        color: #fff;
        padding: 3vw 7vw;
        border-radius: 8vw;
        font-size: 4.5vw;
        font-weight: bold;
        z-index: 9999;
        white-space: nowrap;
        pointer-events: none;
        border: 2px solid transparent;
      }
      #patrol-toast.ok  { border-color: #2ecc71; }
      #patrol-toast.err { border-color: #e74c3c; }

      /* 巡回点検ボタン（メイン画面） */
      .btn-patrol {
        display: block;
        margin-top: 2.5vw;
        padding: 2.5vw;
        background-color: #e94560;
        color: white;
        font-size: 5.625vw;
        font-weight: bold;
        border-radius: 1.25vw;
        box-shadow: 0 0.5vw 0.75vw rgba(0,0,0,0.2);
        border: none;
        width: 100%;
        cursor: pointer;
      }
    </style>
  </head>

  <body>

    <div id="result">
      <span id="status" class="status-text">位置情報を取得中...</span>
      <div id="output"></div>
    </div>



    <!-- 巡回点検モーダル -->
    <div id="patrol-modal">
      <div id="patrol-header" style="position:relative;">
        <div>
          <div id="patrol-kp">---</div>

      function getLocation() {
        const options = {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        };
        navigator.geolocation.watchPosition(success, error, options);
      }

      function success(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        currentGpsLat = lat;
        currentGpsLng = lng;
        const res = calculateNearest(lat, lng);
        showResult(res);

      function error() {

          '<span style="color:red; font-weight:bold;">GPSエラー</span><br>位置情報を許可してください。';
      }

      function calculateNearest(lat, lng) {
        if (!MASTER_DATA || MASTER_DATA.length === 0) {
          return { status: "データなし", distance: "---" };
        }

        let points = MASTER_DATA.map(p => ({
          ...p,
          dist: calculateDistance(lat, lng, p.lat, p.lng)
        }));

        points.sort((a, b) => a.dist - b.dist);
        const nearest = points[0];
        const second = points[1] || nearest;

        let resultKP = (nearest.dist > 50) ? "圏外です" : getInterpolatedKP(nearest, second, lat, lng);

        return {
          status: resultKP,
          distance: nearest.dist.toFixed(1) + "m",
          drawing: nearest.url,
          baseMaster: nearest.label
        };
      }

      function getInterpolatedKP(p1, p2, curLat, curLng) {
        const parseKP = (label) => {
          const match = label.match(/(\d+)(?:-(\d+))?k(\d+)/);
          if (!match) return null;
          const km = parseInt(match[1], 10);
          const branch = match[2] ? parseInt(match[2], 10) : 0;
          const m = parseInt(match[3], 10);
          return {
            totalM: (km * 1000) + (branch * 1000) + m,
            hasHyphen: !!match[2],
            km: km,
            branch: branch
          };
        };

        const d1 = parseKP(p1.label);
        const d2 = parseKP(p2.label);
        if (!d1 || !d2) return p1.label;

        let A = (d1.totalM < d2.totalM) ? { ...p1, m: d1.totalM, data: d1 } : { ...p2, m: d2.totalM, data: d2 };
        let B = (d1.totalM < d2.totalM) ? { ...p2, m: d2.totalM } : { ...p1, m: d1.totalM };

        const x = curLng - A.lng;
        const y = curLat - A.lat;
        const dx = B.lng - A.lng;
        const dy = B.lat - A.lat;
        const mag2 = dx * dx + dy * dy;

        let t = (mag2 !== 0) ? (x * dx + y * dy) / mag2 : 0;
        t = Math.max(0, Math.min(1, t));

        const diffM = Math.abs(d2.totalM - d1.totalM);
        const finalTotalM = A.m + Math.round(diffM * t);

        const finalKm = A.data.hasHyphen ? A.data.km : Math.floor(finalTotalM / 1000);
        const finalBranch = A.data.hasHyphen ? Math.floor((finalTotalM - (A.data.km * 1000)) / 1000) : 0;
        const finalM = A.data.hasHyphen ? (finalTotalM - (A.data.km * 1000)) % 1000 : finalTotalM % 1000;

        if (A.data.hasHyphen) {
          return finalKm + "-" + finalBranch + "k" + finalM.toString().padStart(3, '0');
        } else {
          return finalKm + "k" + finalM.toString().padStart(3, '0');
        }
      }

      function calculateDistance(lat1, lng1, lat2, lng2) {
        const R = 6371000;
        const r1 = lat1 * Math.PI / 180;
        const r2 = lat2 * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        let c = Math.sin(r1) * Math.sin(r2) + Math.cos(r1) * Math.cos(r2) * Math.cos(dLng);
        c = Math.min(1, Math.max(-1, c)); // 浮動小数点誤差でacosの引数が±1を超えNaNになるのを防ぐ
        return Math.acos(c) * R;
      }

      // ===== カメラ機能 =====
      let cameraStream = null;
      let capturedBlob = null;
      let cameraMode = 'normal'; // 'normal'=通常撮影 / 'patrol'=その他異常(巡回送信) / 'fall'=落下物3枚撮影
      let kpLocked = false;     // 距離標を固定中か
      let lockedKP = null;      // 固定時の距離標
      let camKpTimer = null;    // 下部テキストのリアルタイム更新タイマー

      // 現在有効な距離標（固定中は固定値、それ以外は最新値）
      function _currentKP() {
        return (kpLocked && lockedKP !== null) ? lockedKP : latestKiloPost;
      }

      // 下部テキストを枠幅に合わせて自動縮小（基準18px、はみ出す場合のみ縮小）
      function _fitKpText() {
        const overlay = document.getElementById('camera-kp-overlay');
        const el = document.getElementById('camera-kp-text');
        if (!overlay || !el) return;
        el.style.fontSize = '18px';
        const cs = getComputedStyle(overlay);
        const avail = overlay.clientWidth
          - (parseFloat(cs.paddingLeft) || 0)
          - (parseFloat(cs.paddingRight) || 0);
        const textW = el.getBoundingClientRect().width;
        if (avail > 0 && textW > avail) {
          el.style.fontSize = Math.max(9, Math.floor(18 * avail / textW)) + 'px';
        }
      }

      // ライブプレビュー中、下部テキストを一定間隔で更新
      function _startCamKpTimer() {
        _stopCamKpTimer();
        const tick = function() {
          const el = document.getElementById('camera-kp-text');
          if (el) { el.textContent = _getOverlayText(); _fitKpText(); }
        };
        tick();   // 即時1回
        camKpTimer = setInterval(tick, 500);
      }
      function _stopCamKpTimer() {
        if (camKpTimer) { clearInterval(camKpTimer); camKpTimer = null; }
      }

      // 距離標の固定/解除トグル
      function toggleKpLock() {
        kpLocked = !kpLocked;
        const btn = document.getElementById('btn-lock');
        if (kpLocked) {
          lockedKP = latestKiloPost;   // 押した瞬間の距離標で固定
          btn.textContent = '解除';
          btn.classList.add('locked');
        } else {
          lockedKP = null;
          btn.textContent = '距離標固定';
          btn.classList.remove('locked');
        }
        const el = document.getElementById('camera-kp-text');
        if (el) { el.textContent = _getOverlayText(); _fitKpText(); }   // 即時反映
      }

      function _resetKpLock() {

        if (btn) { btn.textContent = '距離標固定'; btn.classList.remove('locked'); }

      function _getDateStr() {

        const date = now.getFullYear() + '/' +

          String(now.getDate()).padStart(2,'0');
        const time = String(now.getHours()).padStart(2,'0') + ':' +
          String(now.getMinutes()).padStart(2,'0');
        return date + '_' + time;
      }

      function capturePhoto() {
        const video  = document.getElementById('camera-video');
        const canvas = document.getElementById('camera-canvas');

        const OUT_W = 1280;
        const OUT_H = 960;
        canvas.width  = OUT_W;
        canvas.height = OUT_H;
        const ctx = canvas.getContext('2d');

        // スマホ縦持ちの映像（縦長）から、ガイド枠に対応する横長部分をクロップ
        // 枠は画面幅=映像幅全体、高さは幅の75%（4:3比率）を縦中央から取る
        const vw = video.videoWidth  || OUT_W;
        const vh = video.videoHeight || OUT_H;

        // 縦映像の中央から4:3サイズを切り出す
        const cropW = vw;                    // 横はフル幅
        const cropH = vw * (OUT_H / OUT_W); // 高さ = 幅 × (960/1280) = 幅 × 0.75
        const cropX = 0;
        const cropY = (vh - cropH) / 2;     // 縦中央からクロップ

        ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, OUT_W, OUT_H);

        // 下端に黒帯＋白文字ゴシック1行
        const overlayText = _getOverlayText();
        const fontSize = 22;
        const bandH   = fontSize + 16;
        const bandY   = OUT_H - bandH;

        ctx.fillStyle = 'rgba(0,0,0,0.82)';
        ctx.fillRect(0, bandY, OUT_W, bandH);

        ctx.fillStyle = '#ffffff';
        ctx.font = `bold ${fontSize}px "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(overlayText, 14, bandY + bandH / 2);

        // プレビュー表示に切り替え
        _stopCamKpTimer();   // 撮影値で確定するため更新停止
        video.style.display = 'none';
        canvas.style.display = 'block';
        document.getElementById('crop-guide').style.display = 'none';
        document.getElementById('camera-kp-overlay').style.display = 'none';
        document.getElementById('btn-lock').style.display = 'none';
        document.getElementById('btn-capture').style.display = 'none';
        document.getElementById('btn-retake').style.display = 'block';
        if (cameraMode === 'patrol') {
          document.getElementById('btn-save').style.display = 'none';
          document.getElementById('btn-patrol-send').style.display = 'block';
          document.getElementById('btn-fall-next').style.display = 'none';
        } else if (cameraMode === 'fall') {
          document.getElementById('btn-save').style.display = 'none';
          document.getElementById('btn-patrol-send').style.display = 'none';
          const nb = document.getElementById('btn-fall-next');
          nb.style.display = 'block';
          // 撮り直し中は「確定」、通常は「次へ」／3枚目は「確認へ」
          nb.textContent = (fallRetakeIndex !== null) ? '確定'
                         : (fallStep >= FALL_STEPS.length - 1 ? '確認へ' : '次へ');
        } else {
          document.getElementById('btn-save').style.display = 'block';
          document.getElementById('btn-patrol-send').style.display = 'none';
          document.getElementById('btn-fall-next').style.display = 'none';
        }

        canvas.toBlob(function(blob) { capturedBlob = blob; }, 'image/jpeg', 0.92);
      }

      async function savePhoto() {
        if (!capturedBlob) return;
        const safeName = _currentKP().replace(/[^a-zA-Z0-9_\-]/g, '');
        const fileName = 'R191_' + safeName + '_hagihosyu.jpg';

          } catch(e) { /* キャンセルや失敗時はダウンロードへ */ }

      // ===== 図面表示機能 =====
      let mapScale = 1;
      let mapOffX = 0;
      let mapOffY = 0;
      let mapImg = null;
      let mapCurrentFile = null;
      let mapCurrentKP = null;
      let mapCurrentLat = null;
      let mapCurrentLng = null;

      // 現在地のGPS座標を保持
      let currentGpsLat = null;
      let currentGpsLng = null;

      function openMapModal() {
        const modal = document.getElementById('map-modal');
        modal.style.display = 'flex';
        document.getElementById('map-status').textContent = '現在地を取得中...';

        // 図面を開く瞬間に最新のGPSを取り直す（前回位置のキャッシュ対策）
        const proceed = function() {
          const nearest = findNearestWithMap(currentGpsLat, currentGpsLng);
          if (!nearest) {
            modal.style.display = 'none';
            alert('この位置に対応する図面がありません。');
            return;
          }
          mapCurrentKP = nearest;
          loadAndShowMap(nearest.map, nearest);
        };

        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(
            function(pos) {
              currentGpsLat = pos.coords.latitude;
              currentGpsLng = pos.coords.longitude;
              proceed();
            },
            function() { proceed(); },   // 取得失敗時は直近の値で開く
            { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
          );
        } else {
          proceed();
        }
      }

      function findNearestWithMap(lat, lng) {
        if (lat === null || lng === null) return null;
        let best = null;
        let bestDist = Infinity;
        for (const p of MASTER_DATA) {
          if (!p.map) continue;
          const d = calculateDistance(lat, lng, p.lat, p.lng);
          if (d < bestDist) { bestDist = d; best = p; }
        }
        // 同じmap内で最近傍を探す（図面全体を読み込むため代表KPとして使用）
        if (!best) return null;
        // 同じmapファイルの全KPを返す（座標変換用）
        best._mapPoints = MASTER_DATA.filter(p => p.map === best.map && p.x !== null && p.y !== null);
        return best;
      }

      function loadAndShowMap(mapFile, nearestKP) {
        const modal = document.getElementById('map-modal');
        modal.style.display = 'flex';
        document.getElementById('map-modal-title').textContent = '図面: ' + mapFile;
        document.getElementById('map-status').textContent = '読み込み中...';

        mapImg = new Image();
        mapImg.onload = function() {
          mapCurrentFile = mapFile;
          initMapView(nearestKP);
        };
        mapImg.onerror = function() {
          document.getElementById('map-status').textContent = 'ファイルが見つかりません: ' + mapFile;
        };
        mapImg.src = mapFile;
      }

      function initMapView(nearestKP) {
        const wrap = document.getElementById('map-canvas-wrap');
        const canvas = document.getElementById('map-canvas');
        const W = wrap.clientWidth;
        const H = wrap.clientHeight;
        const iW = mapImg.naturalWidth;
        const iH = mapImg.naturalHeight;

        canvas.width = iW;
        canvas.height = iH;

        // 初期スケール：画面幅に合わせる
        const baseScale = W / iW;

        // GPS→ピクセル変換（基準点が2点以上あれば使用、なければ中央表示）
        let focusX = iW / 2;
        let focusY = iH / 2;

        const pts = nearestKP._mapPoints;
        if (pts && pts.length >= 2 && currentGpsLat !== null) {
          const converted = gpsToPixel(currentGpsLat, currentGpsLng, pts);
          if (converted) { focusX = converted.x; focusY = converted.y; }
        } else if (nearestKP.x !== null) {
          focusX = nearestKP.x;
          focusY = nearestKP.y;
        }

        // 現在地を中心に、図面の高さが収まる程度＝広めに表示
        const fitH = H / iH;
        mapScale = fitH * 1.5;
        mapOffX = W / 2 - focusX * mapScale;
        mapOffY = H / 2 - focusY * mapScale;

        drawMap();
        updateMapStatus(focusX, focusY, pts && pts.length >= 2);
      }

      function gpsToPixel(lat, lng, pts) {
        // 最近傍2点でアフィン変換（簡易版）
        if (pts.length < 2) return null;

        // 現在地に最も近い2点を選ぶ
        const sorted = pts.slice().sort((a, b) => {
          const da = Math.pow(a.lat - lat, 2) + Math.pow(a.lng - lng, 2);
          const db = Math.pow(b.lat - lat, 2) + Math.pow(b.lng - lng, 2);
          return da - db;
        });
        const p1 = sorted[0];
        const p2 = sorted[1];

        const dLatGps = p2.lat - p1.lat;
        const dLngGps = p2.lng - p1.lng;
        const dXPx  = p2.x - p1.x;
        const dYPx  = p2.y - p1.y;
        const lenGps2 = dLatGps * dLatGps + dLngGps * dLngGps;
        if (lenGps2 === 0) return { x: p1.x, y: p1.y };

        const t = ((lat - p1.lat) * dLatGps + (lng - p1.lng) * dLngGps) / lenGps2;
        return {
          x: p1.x + t * dXPx,
          y: p1.y + t * dYPx
        };
      }

      function drawMap() {
        const canvas = document.getElementById('map-canvas');
        const ctx = canvas.getContext('2d');
        const iW = mapImg.naturalWidth;
        const iH = mapImg.naturalHeight;

        ctx.clearRect(0, 0, iW, iH);
        ctx.drawImage(mapImg, 0, 0);

        // 現在地の赤点を描画
        const pts = mapCurrentKP ? mapCurrentKP._mapPoints : [];
        if (currentGpsLat !== null && pts && pts.length >= 2) {
          const pos = gpsToPixel(currentGpsLat, currentGpsLng, pts);
          if (pos) {
            drawLocationDot(ctx, pos.x, pos.y);
          }
        } else if (mapCurrentKP && mapCurrentKP.x !== null) {
          drawLocationDot(ctx, mapCurrentKP.x, mapCurrentKP.y);
        }

        // canvas の CSS transform でスケール・移動
        canvas.style.transform = `translate(${mapOffX}px, ${mapOffY}px) scale(${mapScale})`;
      }

      function drawLocationDot(ctx, x, y) {
        const r = Math.max(3, 8 / mapScale);
        // 外側白リング
        ctx.beginPath();
        ctx.arc(x, y, r + 3, 0, Math.PI * 2);
        ctx.fillStyle = 'white';
        ctx.fill();
        // 赤点
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = '#e53935';
        ctx.fill();
        // 十字線
        ctx.strokeStyle = 'white';
        ctx.lineWidth = Math.max(1, 2 / mapScale);
        ctx.beginPath();
        ctx.moveTo(x - r * 2, y); ctx.lineTo(x + r * 2, y);
        ctx.moveTo(x, y - r * 2); ctx.lineTo(x, y + r * 2);
        ctx.stroke();
      }

      function updateMapStatus(focusX, focusY, hasCalibration) {
        const label = mapCurrentKP ? mapCurrentKP.label : '';
        const mode = hasCalibration ? '📍 現在地表示' : '⚠️ 基準点未設定（中央表示）';
        document.getElementById('map-status').textContent = label + ' | ' + mode;
      }

      function closeMapModal() {
        document.getElementById('map-modal').style.display = 'none';
        mapImg = null;
        mapCurrentFile = null;
      }

      // ===== タッチ・マウス操作 =====
      (function() {
        let isDragging = false;
        let lastX, lastY;
        let lastDist = null;

        const getWrap = () => document.getElementById('map-canvas-wrap');

        // マウス
        document.addEventListener('mousedown', function(e) {
          if (!e.target.closest('#map-canvas-wrap')) return;
          isDragging = true; lastX = e.clientX; lastY = e.clientY;
        });
        document.addEventListener('mousemove', function(e) {
          if (!isDragging || !mapImg) return;
          mapOffX += e.clientX - lastX;
          mapOffY += e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          drawMap();
        });
        document.addEventListener('mouseup', function() { isDragging = false; });

        // ホイールズーム
        document.addEventListener('wheel', function(e) {
          if (!e.target.closest('#map-canvas-wrap') || !mapImg) return;
          e.preventDefault();
          const wrap = getWrap();
          const rect = wrap.getBoundingClientRect();
          const cx = e.clientX - rect.left;
          const cy = e.clientY - rect.top;
          const delta = e.deltaY > 0 ? 0.85 : 1.18;
          const newScale = Math.max(0.2, Math.min(20, mapScale * delta));
          mapOffX = cx - (cx - mapOffX) * (newScale / mapScale);
          mapOffY = cy - (cy - mapOffY) * (newScale / mapScale);
          mapScale = newScale;
          drawMap();
        }, { passive: false });

        // タッチ
        document.addEventListener('touchstart', function(e) {
          if (!e.target.closest('#map-canvas-wrap') || !mapImg) return;
          if (e.touches.length === 1) {
            isDragging = true;
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
          } else if (e.touches.length === 2) {
            isDragging = false;
            lastDist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
          }
        }, { passive: true });

        document.addEventListener('touchmove', function(e) {
          if (!e.target.closest('#map-canvas-wrap') || !mapImg) return;
          e.preventDefault();
          if (e.touches.length === 1 && isDragging) {
            mapOffX += e.touches[0].clientX - lastX;
            mapOffY += e.touches[0].clientY - lastY;
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
            drawMap();
          } else if (e.touches.length === 2) {
            const dist = Math.hypot(
              e.touches[0].clientX - e.touches[1].clientX,
              e.touches[0].clientY - e.touches[1].clientY
            );
            if (lastDist) {
              const wrap = getWrap();
              const rect = wrap.getBoundingClientRect();
              const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
              const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;
              const delta = dist / lastDist;
              const newScale = Math.max(0.2, Math.min(20, mapScale * delta));
              mapOffX = cx - (cx - mapOffX) * (newScale / mapScale);
              mapOffY = cy - (cy - mapOffY) * (newScale / mapScale);
              mapScale = newScale;
              drawMap();
            }
            lastDist = dist;
          }
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
          isDragging = false;
          if (e.touches.length < 2) lastDist = null;
        });
      })();


      // ===== 巡回点検機能 =====
      // ★設定：GASのURLだけをここに入れてください★
      // （LINEのトークンとグループIDはGAS側に書く＝公開ソースに出さないため安全）
      const PATROL_GAS_URL = 'https://script.google.com/macros/s/AKfycbwdm1WJSxOa5zzUC4wb1AtGGzSCUFy1Cq_Vs9DoQnDy6RNyLInDYkTJfV3swO0tAYLaZg/exec';

      let patrolUser = '';

      function openPatrol() {

      function patrolStartClock() {
        if (patrolClockTimer) clearInterval(patrolClockTimer);
        function tick() {
          const now = new Date();
          const h = String(now.getHours()).padStart(2,'0');
          const m = String(now.getMinutes()).padStart(2,'0');

      async function patrolSend(eventName) {
        const kp   = latestKiloPost || '不明';
        const now  = new Date();
        const date = now.getFullYear() + '/' +
          String(now.getMonth()+1).padStart(2,'0') + '/' +
          String(now.getDate()).padStart(2,'0');
        const time = String(now.getHours()).padStart(2,'0') + ':' +
          String(now.getMinutes()).padStart(2,'0');

        const msg = `📍 ${kp}\n⚠️ ${eventName}\n🕐 ${date} ${time}\n👤 ${patrolUser}`;

        patrolToast('📡 送信中...', '');
        try {
          await fetch(PATROL_GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: 'line',
              message: msg,
              kp, event: eventName, date, time, user: patrolUser
            })
          });
          patrolToast('✅ 送信しました', 'ok');
        } catch(e) {
          patrolToast('❌ 送信エラー', 'err');

      }

      // Blob → base64（data URLの本体部分のみ）
      function _blobToBase64(blob) {
        return new Promise(function(resolve, reject) {
          const r = new FileReader();
          r.onload = function() { resolve(String(r.result).split(',')[1]); };
          r.onerror = reject;
          r.readAsDataURL(blob);
        });
      }

      // 「その他異常」：撮影した写真＋距離標等をGAS経由でLINE送信
      async function patrolSendPhoto() {
        if (!capturedBlob) return;
        const kp   = _currentKP() || '不明';   // 距離標固定中はその値
        const now  = new Date();
        const date = now.getFullYear() + '/' +
          String(now.getMonth()+1).padStart(2,'0') + '/' +
          String(now.getDate()).padStart(2,'0');
        const time = String(now.getHours()).padStart(2,'0') + ':' +
          String(now.getMinutes()).padStart(2,'0');
        const user = patrolUser || '';

        let base64;
        try {
          base64 = await _blobToBase64(capturedBlob);
        } catch(e) {
          patrolToast('❌ 画像変換エラー', 'err');
          return;
        }

        closeCamera();                 // カメラを閉じて巡回画面へ戻す（トーストを見せるため）
        patrolToast('📡 送信中...', '');

        const msg = `📍 ${kp}\n⚠️ その他異常\n🕐 ${date} ${time}\n👤 ${user}`;
        try {
          await fetch(PATROL_GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              type: 'line_image',
              message: msg,
              kp, event: 'その他異常', date, time, user,
              image: base64, mimeType: 'image/jpeg'
            })
          });
          patrolToast('✅ 送信しました', 'ok');
        } catch(e) {
          patrolToast('❌ 送信エラー', 'err');
        }
      }

      // ===== 落下物：処理前 → 近景 → 処理後 の3枚撮影＆クラウドアップロード =====
      const FALL_STEPS = ['処理前', '近景', '処理後'];
      let fallShots = [null, null, null];  // {blob, url, kp, date, time}
      let fallStep = 0;                    // 現在の撮影工程 0..2
      let fallRetakeIndex = null;          // 確認画面から撮り直し中のインデックス
      let fallGroupId = '';                // 3枚を紐づけるID
      let fallUploading = false;

      function fallToast(msg, type) {
        const t = document.getElementById('fall-toast');
        if (!t) return;
        t.textContent = msg;
        t.className = type || '';
        t.style.display = 'block';
        clearTimeout(t._tm);
        if (type) t._tm = setTimeout(function() { t.style.display = 'none'; }, 2500);
      }

      function _fallClearShots() {
        fallShots.forEach(function(s) { if (s && s.url) URL.revokeObjectURL(s.url); });
        fallShots = [null, null, null];
        fallStep = 0;
        fallRetakeIndex = null;
        fallUploading = false;
        const th = document.getElementById('fall-thumbs');
        if (th) th.innerHTML = '';
        const rl = document.getElementById('fall-review-list');
        if (rl) rl.innerHTML = '';
      }

      function _fallUpdateBadge() {
        const title = document.getElementById('fall-step-title');
        const count = document.getElementById('fall-step-count');
        if (!title || !count) return;
        title.textContent = '落下物：' + FALL_STEPS[fallStep];
        count.textContent = (fallRetakeIndex !== null)
          ? '撮り直し中'
          : (fallStep + 1) + ' / ' + FALL_STEPS.length + ' 枚目';
      }

      function _fallUpdateThumbs() {
        const box = document.getElementById('fall-thumbs');
        if (!box) return;
        box.innerHTML = '';
        fallShots.forEach(function(s) {
          if (!s) return;
          const img = document.createElement('img');
          img.src = s.url;
          box.appendChild(img);
        });
      }

      // 「次へ」／「確認へ」／「確定」
      function fallNextStep() {
        if (!capturedBlob) { fallToast('画像がありません', 'err'); return; }

        const idx = (fallRetakeIndex !== null) ? fallRetakeIndex : fallStep;
        if (fallShots[idx] && fallShots[idx].url) URL.revokeObjectURL(fallShots[idx].url);

        const now = new Date();
        fallShots[idx] = {
          blob: capturedBlob,
          url : URL.createObjectURL(capturedBlob),
          kp  : _currentKP() || '不明',
          date: now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0'),
          time: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0')
        };
        capturedBlob = null;

        // 1枚目を撮った時点で距離標を固定（3枚とも同じ距離標にするため）
        if (idx === 0 && !kpLocked) toggleKpLock();

        if (fallRetakeIndex !== null) {   // 撮り直し完了 → 確認画面へ戻る
          fallRetakeIndex = null;
          _fallShowReview();
          return;
        }

        if (fallStep < FALL_STEPS.length - 1) {
          fallStep++;
          _fallUpdateBadge();
          _fallUpdateThumbs();
          retakePhoto();                  // ライブプレビューに戻す
          fallToast('次は「' + FALL_STEPS[fallStep] + '」を撮影');
          setTimeout(function() {
            const t = document.getElementById('fall-toast');
            if (t) t.style.display = 'none';
          }, 2000);
        } else {
          _fallShowReview();
        }
      }

      function _fallShowReview() {
        _stopCamKpTimer();
        const rev  = document.getElementById('fall-review');
        const list = document.getElementById('fall-review-list');
        document.getElementById('fall-review-kp').textContent =
          '距離標 ' + (fallShots[0] ? fallShots[0].kp : '---') +
          '　' + (fallShots[0] ? fallShots[0].date + ' ' + fallShots[0].time : '');
        list.innerHTML = '';
        fallShots.forEach(function(s, i) {
          if (!s) return;
          const wrap = document.createElement('div');
          wrap.className = 'fall-review-item';
          const cap = document.createElement('div');
          cap.className = 'cap';
          cap.textContent = (i + 1) + '. ' + FALL_STEPS[i];
          const img = document.createElement('img');
          img.src = s.url;
          const btn = document.createElement('button');
          btn.textContent = '撮り直し';
          btn.onclick = function() { fallRetake(i); };
          wrap.appendChild(cap); wrap.appendChild(img); wrap.appendChild(btn);
          list.appendChild(wrap);
        });
        document.getElementById('btn-fall-upload').disabled = false;
        document.getElementById('btn-fall-upload').textContent = '☁️ アップロード';
        rev.style.display = 'flex';
      }

      function fallRetake(i) {
        fallRetakeIndex = i;
        fallStep = i;                     // 焼き込む工程名を合わせる
        document.getElementById('fall-review').style.display = 'none';
        _fallUpdateBadge();
        retakePhoto();
      }

      function fallCancel() {
        if (fallUploading) return;
        if (!confirm('3枚とも破棄してやり直しますか？')) return;
        _fallClearShots();
        document.getElementById('fall-review').style.display = 'none';
        fallGroupId = 'FO' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        _fallUpdateBadge();
        _fallUpdateThumbs();
        retakePhoto();
      }

      // 3枚をGAS経由でGoogle Driveへアップロード（1枚ずつ順番に送信）
      async function fallUpload() {
        if (fallUploading) return;
        if (fallShots.some(function(s) { return !s; })) {
          fallToast('❌ 3枚そろっていません', 'err');
          return;
        }
        fallUploading = true;
        const btn = document.getElementById('btn-fall-upload');
        btn.disabled = true;

        const kp     = fallShots[0].kp;
        const date   = fallShots[0].date;
        const time   = fallShots[0].time;
        const stamp  = date.replace(/\//g, '') + '_' + time.replace(':', '');
        const safeKP = kp.replace(/[^a-zA-Z0-9_\-]/g, '');
        const user   = patrolUser || '';

        try {
          for (let i = 0; i < fallShots.length; i++) {
            btn.textContent = '📡 送信中... ' + (i + 1) + '/' + fallShots.length;
            fallToast('📡 送信中... ' + (i + 1) + '/' + fallShots.length);
            const base64 = await _blobToBase64(fallShots[i].blob);
            await fetch(PATROL_GAS_URL, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'fallen_object',
                groupId: fallGroupId,
                index: i + 1,
                total: fallShots.length,
                stage: FALL_STEPS[i],
                fileName: 'R191_' + safeKP + '_' + stamp + '_' + (i + 1) + '_' + FALL_STEPS[i] + '.jpg',
                kp: kp, date: date, time: time, user: user,
                event: '落下物',
                message: '📍 ' + kp + '\n🧱 落下物（' + FALL_STEPS[i] + ' ' + (i + 1) + '/' + fallShots.length + '）\n🕐 ' + date + ' ' + time + (user ? '\n👤 ' + user : ''),
                image: base64,
                mimeType: 'image/jpeg'
              })
            });
          }
          fallToast('✅ 3枚アップロードしました', 'ok');
          setTimeout(closeCamera, 1600);
        } catch (e) {
          fallUploading = false;
          btn.disabled = false;
          btn.textContent = '☁️ 再アップロード';
          fallToast('❌ 送信エラー（電波を確認して再試行）', 'err');
        }
      }
    </script>
  </body>
</html>
