<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1736">
  <title>萩保守 記録ダッシュボード</title>
  <style>
    :root{--navy:#0b1736;--blue:#1976d2;--orange:#ef6c00;--paper:#fff;--muted:#697386}
    *{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#182033;font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic","Meiryo",sans-serif}
    header{padding:18px 18px 14px;background:linear-gradient(135deg,#0b1736,#173b72);color:#fff}
    header h1{margin:0;font-size:22px}header p{margin:6px 0 0;color:#cfe1ff;font-size:13px}
    .back{color:#fff;text-decoration:none;font-size:14px;display:inline-block;margin-bottom:10px}
    main{max-width:1100px;margin:auto;padding:14px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .tab{border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:800;color:#fff;cursor:pointer;opacity:.55}
    .tab.active{opacity:1;box-shadow:0 5px 14px #24334a38;transform:translateY(-1px)}
    .tab.patrol{background:var(--blue)}.tab.fallen{background:var(--orange)}
    .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
    .card{background:var(--paper);border-radius:14px;padding:13px;box-shadow:0 2px 8px #14213d15}
    .card small{display:block;color:var(--muted);font-weight:700}.card strong{display:block;font-size:24px;margin-top:4px}.card span{font-size:12px;color:var(--muted)}
    .chart-card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 3px 12px #14213d22}
    .chart-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin-bottom:14px}.chart-head h2{font-size:18px;margin:0}.chart-head span{font-size:12px;color:var(--muted)}
    .chart-switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}.chart-switch button{border:2px solid #d7dfeb;border-radius:10px;background:#f6f8fb;color:#4b586d;padding:10px 6px;font-size:14px;font-weight:800;cursor:pointer}.chart-switch button.active{border-color:var(--blue);background:#e8f2ff;color:#075cad}.chart-switch button.fallen.active{border-color:var(--orange);background:#fff0e4;color:#b64c00}
    #chart{display:grid;gap:9px}.bar-row{display:grid;grid-template-columns:minmax(76px,140px) 1fr 42px;gap:9px;align-items:center;min-height:30px}.bar-label{font-size:13px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}.bar-track{height:25px;background:#edf1f6;border-radius:7px;overflow:hidden}.bar{height:100%;min-width:3px;border-radius:7px;background:linear-gradient(90deg,#1976d2,#63a4ff);transition:width .3s}.bar.fallen{background:linear-gradient(90deg,#ef6c00,#ffb04c)}.bar-value{font-weight:900;font-variant-numeric:tabular-nums}
    .section-title{font-size:17px;margin:18px 2px 9px}.breakdown{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#fff;border-radius:999px;padding:8px 11px;font-size:13px;box-shadow:0 1px 5px #14213d18}.chip b{margin-left:5px}
    .records{display:grid;gap:9px}.record{background:#fff;border-radius:13px;padding:12px;border-left:5px solid var(--blue);box-shadow:0 2px 7px #14213d12}.record.fallen{border-left-color:var(--orange)}
    .record-head{display:flex;justify-content:space-between;gap:8px;font-weight:800}.record-meta{margin-top:5px;font-size:13px;color:#4c586c;line-height:1.55}.record a{display:inline-block;margin:7px 9px 0 0;color:#075fbd;font-weight:700;text-decoration:none}
    .empty,.error{background:#fff;border-radius:14px;padding:20px;text-align:center;color:var(--muted)}.error{color:#b3261e}
    @media(max-width:560px){header h1{font-size:19px}.summary{grid-template-columns:1fr 1fr}.summary .card:last-child{grid-column:1/-1}.bar-row{grid-template-columns:74px 1fr 32px;gap:6px}.bar-label{font-size:12px}.record-head{display:block}.record-head span{display:block;margin-top:4px;font-size:12px;color:var(--muted)}}
  </style>
</head>
<body>
  <header><a class="back" href="./">← 距離標アプリへ戻る</a><h1 id="title">記録ダッシュボード</h1><p>道路点検と落下物の件数・写真・記録を確認</p></header>
  <main>
    <div class="tabs">
      <button class="tab patrol active" onclick="selectMode('patrol')">🚗 点検バージョン</button>
      <button class="tab fallen" onclick="selectMode('fallen')">📦 落下物バージョン</button>
    </div>
    <div class="summary">
      <div class="card"><small>記録件数</small><strong id="count">0</strong><span>表示中の記録</span></div>
      <div class="card"><small>本日の記録</small><strong id="today">0</strong><span id="today-label">今日</span></div>
      <div class="card"><small>最終更新</small><strong id="updated" style="font-size:16px">---</strong><span>GASから取得</span></div>
    </div>
    <section class="chart-card"><div id="chart-switch" class="chart-switch"></div><div class="chart-head"><h2 id="chart-title">異常項目別の点検件数</h2><span id="chart-note">異常項目ごとに集計</span></div><div id="chart"></div></section>
    <h2 class="section-title">項目別</h2><div id="breakdown" class="breakdown"></div>
    <h2 class="section-title">最新の記録</h2><div id="records" class="records"><div class="empty">読み込み中...</div></div>
  </main>
  <script>
    let settings={}, data={patrol:[],fallen:[]}, mode='patrol', chartMode='item';
    const pick=(r,names)=>{for(const n of names){if(r[n]!==undefined&&String(r[n]).trim()!=='')return String(r[n]).trim()}return''};
    const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const num=v=>{const n=parseFloat(String(v||'').replace(',','.'));return Number.isFinite(n)?n:null};
    function normalized(r,type){return{raw:r,date:pick(r,['日付','撮影日']),time:pick(r,['時刻','撮影時刻']),route:pick(r,['路線']),kp:pick(r,['距離標']),lane:pick(r,['車線','方向']),item:type==='patrol'?pick(r,['異常項目','項目']):pick(r,['種類','落下物種類']),comment:pick(r,['コメント','備考']),user:pick(r,['担当者','氏名']),lat:num(pick(r,['緯度','lat','Latitude'])),lng:num(pick(r,['経度','lng','Longitude'])),photo:pick(r,['写真URL','写真','画像URL']),folder:pick(r,['保存フォルダ','フォルダURL','Googleドライブ','DriveURL'])}}
    function selectMode(next){mode=next;chartMode='item';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.classList.contains(next)));render()}
    function selectChart(next){chartMode=next;render()}
    function render(){const rows=(data[mode]||[]).map(r=>normalized(r,mode));document.getElementById('count').textContent=rows.length;const d=new Date(),today=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;document.getElementById('today').textContent=rows.filter(r=>r.date===today).length;document.getElementById('updated').textContent=data.updatedAt||'---';renderChartSwitch();renderChart(rows);renderBreakdown(rows);renderRecords(rows)}
    function renderChartSwitch(){const itemLabel=mode==='patrol'?'異常項目別':'種類別';document.getElementById('chart-switch').innerHTML=`<button class="${mode} ${chartMode==='item'?'active':''}" onclick="selectChart('item')">${itemLabel}</button><button class="${mode} ${chartMode==='km'?'active':''}" onclick="selectChart('km')">距離標区間別</button>`}
    function kpGraphBucket(kp){const m=String(kp||'').match(/(\d+)\s*(?:-\s*(\d+))?\s*k/i);if(!m)return{label:'距離標不明',order:Number.MAX_SAFE_INTEGER};const main=Number(m[1]),branch=m[2]===undefined?null:Number(m[2]);return{label:main+(branch===null?'':'-'+branch)+'k',order:main*100000+(branch===null?0:branch)}}
    function renderChart(rows){const counts={};const orders={};if(chartMode==='km'){document.getElementById('chart-title').textContent='距離標区間別の'+(mode==='patrol'?'点検':'落下物')+'件数';document.getElementById('chart-note').textContent='ブレーク区間を含めて順番に集計';rows.forEach(r=>{const bucket=kpGraphBucket(r.kp);counts[bucket.label]=(counts[bucket.label]||0)+1;orders[bucket.label]=bucket.order})}else{document.getElementById('chart-title').textContent=(mode==='patrol'?'異常項目別の点検件数':'落下物の種類別件数');document.getElementById('chart-note').textContent=(mode==='patrol'?'異常項目':'種類')+'ごとに集計';rows.forEach(r=>{const key=r.item||(mode==='patrol'?'項目不明':'種類不明');counts[key]=(counts[key]||0)+1})}const entries=Object.entries(counts).sort((a,b)=>chartMode==='km'?(orders[a[0]]-orders[b[0]]):b[1]-a[1]);const max=Math.max(1,...entries.map(x=>x[1]));document.getElementById('chart').innerHTML=entries.map(([label,value])=>`<div class="bar-row"><div class="bar-label" title="${esc(label)}">${esc(label)}</div><div class="bar-track"><div class="bar ${mode}" style="width:${Math.max(2,value/max*100)}%"></div></div><div class="bar-value">${value}</div></div>`).join('')||'<div class="empty">記録がありません</div>'}
    function renderBreakdown(rows){const counts={};rows.forEach(r=>{const k=r.item||'未設定';counts[k]=(counts[k]||0)+1});const el=document.getElementById('breakdown');el.innerHTML=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="chip">${esc(k)}<b>${v}</b></span>`).join('')||'<div class="empty">記録がありません</div>'}
    function renderRecords(rows){const el=document.getElementById('records');const sorted=rows.slice().sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,100);el.innerHTML=sorted.map(r=>`<article class="record ${mode}"><div class="record-head"><b>${esc(r.route)} ${esc(r.kp)}　${esc(r.item||'未設定')}</b><span>${esc(r.date)} ${esc(r.time)}</span></div><div class="record-meta">${esc(r.lane)}${r.user?'　担当：'+esc(r.user):''}${r.comment?'<br>'+esc(r.comment):''}</div>${r.photo?`<a href="${esc(r.photo)}" target="_blank">📷 写真</a>`:''}${r.folder?`<a href="${esc(r.folder)}" target="_blank">📁 保存先</a>`:''}</article>`).join('')||'<div class="empty">記録がありません</div>'}
    function loadDashboard(){return new Promise((resolve,reject)=>{const cb='dashboardCallback_'+Date.now();window[cb]=payload=>{delete window[cb];script.remove();payload.ok?resolve(payload):reject(new Error(payload.error||'取得に失敗'))};const script=document.createElement('script');script.onerror=()=>reject(new Error('GASに接続できません'));script.src=settings.gasUrl+'?action=dashboard&callback='+encodeURIComponent(cb)+'&t='+Date.now();document.head.appendChild(script)})}
    (async()=>{try{settings=await fetch('data/settings.json',{cache:'no-cache'}).then(r=>r.json());document.getElementById('title').textContent=(settings.areaName||'')+' 記録ダッシュボード';data=await loadDashboard();render()}catch(e){document.getElementById('records').innerHTML='<div class="error">記録を読み込めませんでした。GASを最新版へ更新して再デプロイしてください。<br>'+esc(e.message)+'</div>'}})();
  </script>
</body>
</html>
